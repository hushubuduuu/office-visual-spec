name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      # ubuntu-24.04 runners restrict unprivileged user namespaces, which
      # crashes Chrome's sandbox; the documented CI/container path is to
      # force --no-sandbox via OVS_NO_SANDBOX.
      OVS_NO_SANDBOX: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Doctor
        # The runner image ships Google Chrome at /usr/bin/google-chrome.
        # Do NOT pin OVS_BROWSER to a playwright-installed chromium: its
        # main build hangs the headless probe (--dump-dom + --virtual-time-
        # budget) and crashes without --no-sandbox, while the preinstalled
        # Chrome completes the same probe in <1s.
        run: python scripts/doctor.py

      - name: Validate all templates
        run: |
          for t in a4-summary ppt-16-9 ppt-web html-page xhs-cards mobile-long infographic; do
            node scripts/validate-html.mjs "templates/$t.html"
          done

      - name: Overflow check all types
        run: |
          python scripts/render-html.py a4 templates/a4-summary.html --check-only
          python scripts/render-html.py html-ppt templates/ppt-16-9.html --check-only
          python scripts/render-html.py ppt-web templates/ppt-web.html --check-only
          python scripts/render-html.py html-page templates/html-page.html --check-only
          python scripts/render-html.py xhs templates/xhs-cards.html --check-only
          python scripts/render-html.py mobile-long templates/mobile-long.html --check-only
          python scripts/render-html.py infographic templates/infographic.html --check-only

      - name: Full export a4 (assert PNG size and PDF pages)
        run: |
          python scripts/render-html.py a4 templates/a4-summary.html out/
          python - <<'PY'
          from PIL import Image
          img = Image.open("out/png/a4-full.png")
          expect = (794 * 2, 6 * 1123 * 2)
          assert img.size == expect, f"a4-full.png size {img.size} != {expect}"
          import pymupdf
          doc = pymupdf.open("out/pdf/a4.pdf")
          assert doc.page_count == 6, f"a4.pdf pages {doc.page_count} != 6"
          print("a4 export OK:", img.size, doc.page_count, "pages")
          PY

      - name: Auxiliary scripts smoke
        run: |
          python -c "import sys; sys.path.insert(0, 'scripts'); import pdf_from_html, long_essay_to_png, pptx_template; print('aux imports OK')"
          python scripts/pptx_template.py out/aux-example.pptx
          python scripts/pdf_from_html.py out/aux-a4.pdf --input templates/a4-summary.html
          python scripts/long_essay_to_png.py templates/mobile-long.html out/aux-long.png --width 1080

  windows-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Doctor
        run: python scripts/doctor.py

      - name: Validate A4 template
        run: node scripts/validate-html.mjs templates/a4-summary.html

      - name: Overflow check a4
        run: python scripts/render-html.py a4 templates/a4-summary.html --check-only

      - name: Full export a4 (assert PNG size and PDF pages)
        # windows-latest default shell is PowerShell, which has no bash
        # heredoc; run this step under Git Bash instead.
        shell: bash
        run: |
          python scripts/render-html.py a4 templates/a4-summary.html out/
          python - <<'PY'
          from PIL import Image
          img = Image.open("out/png/a4-full.png")
          expect = (794 * 2, 6 * 1123 * 2)
          assert img.size == expect, f"a4-full.png size {img.size} != {expect}"
          import pymupdf
          doc = pymupdf.open("out/pdf/a4.pdf")
          assert doc.page_count == 6, f"a4.pdf pages {doc.page_count} != 6"
          print("windows a4 export OK:", img.size, doc.page_count, "pages")
          PY

  macos-smoke:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: "Headless diagnostic (temporary: macOS user-data-dir hang)"
        run: |
          python - <<'PY'
          import subprocess, tempfile
          CHROME = "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
          base = ["--headless=new", "--use-mock-keychain", "--disable-gpu", "--dump-dom", "about:blank"]
          def t(label, extra):
              try:
                  r = subprocess.run([CHROME] + extra + base, capture_output=True, timeout=15)
                  txt = (r.stdout[:60] or r.stderr[:80]).decode("utf-8", "ignore").replace("\n", " ")
                  print(label, "rc=", r.returncode, txt)
              except subprocess.TimeoutExpired:
                  print(label, "TIMEOUT")
          t("no-udd       ", [])
          t("udd          ", ["--user-data-dir=" + tempfile.mkdtemp()])
          t("incognito    ", ["--incognito"])
          t("udd+incognito", ["--user-data-dir=" + tempfile.mkdtemp(), "--incognito"])
          t("udd+nosandbox", ["--user-data-dir=" + tempfile.mkdtemp(), "--no-sandbox"])
          PY

      - name: install.sh end-to-end (python probe + venv + pip + doctor)
        # Covers the real installation path on macOS. The runner preinstalls
        # Google Chrome at /Applications/Google Chrome.app/... which
        # BROWSER_CANDIDATES finds; do NOT set OVS_NO_SANDBOX here (the
        # macOS sandbox works normally).
        run: bash install.sh

      - name: Overflow check all types
        run: |
          .venv/bin/python scripts/render-html.py a4 templates/a4-summary.html --check-only
          .venv/bin/python scripts/render-html.py html-ppt templates/ppt-16-9.html --check-only
          .venv/bin/python scripts/render-html.py ppt-web templates/ppt-web.html --check-only
          .venv/bin/python scripts/render-html.py html-page templates/html-page.html --check-only
          .venv/bin/python scripts/render-html.py xhs templates/xhs-cards.html --check-only
          .venv/bin/python scripts/render-html.py mobile-long templates/mobile-long.html --check-only
          .venv/bin/python scripts/render-html.py infographic templates/infographic.html --check-only

      - name: "Full export a4 (loose assertion: font metrics differ on macOS)"
        run: |
          .venv/bin/python scripts/render-html.py a4 templates/a4-summary.html out-mac/
          .venv/bin/python - <<'PY'
          import pymupdf
          doc = pymupdf.open("out-mac/pdf/a4.pdf")
          assert doc.page_count == 6, doc.page_count
          print("macOS a4 export OK:", doc.page_count, "pages")
          PY
