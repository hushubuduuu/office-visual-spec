<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HTML PPT · 暖纸红印</title>
<style>
:root {
  --paper: #FAF8F5;
  --ink: #221E1A;
  --body: #443F3A;
  --muted: #8E877F;
  --red: #C60D0D;
  --deep-red: #A50A0A;
  --divider: #E2DDD5;
  --card: #FDF9F7;
  --on-accent: #FAF8F5;
  --sans: system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica Neue, PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif;
  --serif: Georgia, STSongti-SC, Songti SC, Noto Serif CJK SC, Source Han Serif SC, SimSun, serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #EDEAE4;
  font-family: var(--sans);
  color: var(--ink);
}
.sheet {
  width: 1280px;
  height: 720px;
  margin: 24px auto;
  background: var(--paper);
  color: var(--ink);
  padding: 48px 64px 40px;
  position: relative;
  overflow: hidden;
  page-break-after: always;
  break-after: page;
  box-shadow: 0 24px 60px rgba(34, 30, 26, 0.14);
}
.sheet:last-child { page-break-after: auto; break-after: auto; }
@page { size: 1280px 720px; margin: 0; }
.sheet::before {
  content: "";
  position: absolute;
  inset: 18px;
  border: 1px solid rgba(34, 30, 26, 0.08);
  pointer-events: none;
}
.sheet::after {
  content: "";
  position: absolute;
  top: 30px;
  right: 30px;
  width: 12px;
  height: 12px;
  background: var(--red);
  opacity: 0.75;
  box-shadow: 0 0 0 5px rgba(198, 13, 13, 0.1);
}
.ghost {
  position: absolute;
  right: 26px;
  bottom: 18px;
  font-family: var(--serif);
  font-weight: 900;
  font-size: 180px;
  line-height: 1;
  color: rgba(34, 30, 26, 0.055);
  letter-spacing: -0.04em;
  user-select: none;
}
.kicker {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  font-size: 12px;
  letter-spacing: 0.22em;
  color: var(--muted);
  text-transform: uppercase;
}
.kicker::before { content: ""; width: 42px; height: 2px; background: var(--red); }
.rule {
  width: 100%;
  height: 1px;
  background: linear-gradient(90deg, var(--red), rgba(34, 30, 26, 0.12) 30%, transparent);
  margin: 16px 0 0;
}
.title {
  font-size: 60px;
  font-weight: 800;
  line-height: 1.08;
  letter-spacing: -0.02em;
  margin: 18px 0 12px;
  max-width: 820px;
}
.title .red { color: var(--red); }
.subtitle {
  font-size: 24px;
  color: var(--body);
  line-height: 1.6;
  max-width: 680px;
}
.doctype {
  display: inline-block;
  margin-top: 34px;
  padding: 10px 18px;
  border: 1px solid var(--divider);
  border-radius: 6px;
  background: var(--card);
  color: var(--red);
  font-size: 14px;
  letter-spacing: 0.16em;
  font-weight: 700;
}
.tag {
  display: inline-block;
  margin-top: 34px;
  padding: 10px 18px;
  border: 1px solid var(--divider);
  border-radius: 999px;
  background: rgba(253, 249, 247, 0.7);
  color: var(--muted);
  font-size: 14px;
  letter-spacing: 0.18em;
}
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 24px; }
.card {
  position: relative;
  background: var(--card);
  border: 1px solid var(--divider);
  border-radius: 14px;
  padding: 24px 28px 22px;
  box-shadow: 0 3px 8px rgba(34, 30, 26, 0.08), 0 20px 44px rgba(34, 30, 26, 0.13);
  break-inside: avoid;
  overflow: hidden;
}
.card::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 5px;
  background: linear-gradient(90deg, var(--red), rgba(198, 13, 13, 0.08));
}
.card .num {
  font-family: var(--serif);
  font-size: 18px;
  color: var(--red);
  letter-spacing: 0.08em;
}
.card h3 { font-size: 24px; font-weight: 800; margin: 8px 0 6px; }
.card p { font-size: 16px; line-height: 1.6; color: var(--body); }
.end { display: grid; place-items: center; text-align: center; }
@keyframes gjs-anim-fadeIn { from { opacity: 0; } to { opacity: 1; } }
.anim-load { animation: gjs-anim-fadeIn 1s ease both; }

@media print {
  body { background: var(--paper); }
  .sheet { margin: 0; box-shadow: none; }
}

h1, h2, h3, .title, .subtitle, .body, p, li, .intro, .v, .meta-pill, .doctype {
  text-wrap: pretty;
}
.title, h1, h2, h3 {
  text-wrap: balance;
}
</style>
</head>
<body>

<div class="sheet">
  <span class="ghost">01</span>
  <div class="kicker">OFFICE VISUAL SPEC</div>
  <h1 class="title">标题写在这里<br><span class="red">红色副题在这里</span></h1>
  <p class="subtitle">一段定位语，说明这份 PPT 的核心信息。</p>
  <span class="doctype">HTML PPT · 分享阅读版</span>
  <div class="rule"></div>
</div>

<div class="sheet">
  <span class="ghost">02</span>
  <div class="kicker">01 · CONTENT</div>
  <h2 class="title" style="font-size:40px">内容页标题</h2>
  <div class="grid">
    <div class="card">
      <span class="num">01</span>
      <h3>要点一</h3>
      <p>在这里填写第一点内容，一句话讲清楚。</p>
    </div>
    <div class="card">
      <span class="num">02</span>
      <h3>要点二</h3>
      <p>在这里填写第二点内容，一句话讲清楚。</p>
    </div>
  </div>
  <div class="rule"></div>
</div>

<div class="sheet end">
  <span class="ghost">03</span>
  <div class="kicker">RECAP · THANKS</div>
  <h2 class="title" style="text-align:center">一句话收束语</h2>
  <div class="grid" style="grid-template-columns:1fr 1fr 1fr">
    <div class="card"><span class="num">01</span><h3>核心结论</h3><p>一句话讲清核心。</p></div>
    <div class="card"><span class="num">02</span><h3>行动建议</h3><p>一句话讲清下一步。</p></div>
    <div class="card"><span class="num">03</span><h3>署名</h3><p>品牌或联系方式。</p></div>
  </div>
  <span class="doctype" style="margin-top:36px">HTML PPT · 分享阅读版</span>
</div>

</body>
</html>
