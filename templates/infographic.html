<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>信息图 · 暖纸红印</title>
<style>
:root {
  --paper: #FDFDFB;
  --ink: #181614;
  --body: #2E2A27;
  --muted: #7E7872;
  --red: #D31212;
  --divider: #EBE6DF;
  --card: #FFFBF9;
  --sans: system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica Neue, PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #EDEAE4; font-family: var(--sans); color: var(--ink); }
.canvas {
  width: 1080px;
  height: 1215px;
  margin: 24px auto;
  background: var(--paper);
  padding: 72px 64px 64px;
  position: relative;
  overflow: hidden;
  box-shadow: 0 24px 60px rgba(24, 22, 20, 0.14);
}
@page { size: 1080px 1215px; margin: 0; }
@media print {
  body { background: var(--paper); }
  .canvas { margin: 0; box-shadow: none; }
}
.kicker { font-size: 22px; letter-spacing: 0.2em; color: var(--muted); }
.title { font-size: 68px; font-weight: 800; line-height: 1.15; margin: 22px 0 18px; }
.title .red { color: var(--red); }
.subtitle { font-size: 26px; line-height: 1.6; color: var(--body); max-width: 860px; }
.meta-line { display: flex; gap: 18px; flex-wrap: wrap; margin: 26px 0 36px; font-size: 18px; color: var(--muted); }
.flow { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
.node {
  background: var(--card);
  border: 1px solid var(--divider);
  border-radius: 14px;
  padding: 30px 32px;
  box-shadow: 0 3px 8px rgba(24,22,20,.06), 0 16px 34px rgba(24,22,20,.08);
  break-inside: avoid;
}
.node .no { color: var(--red); font-size: 18px; font-weight: 800; letter-spacing: .1em; }
.node h4 { font-size: 30px; font-weight: 800; margin: 12px 0 10px; }
.node p { font-size: 22px; line-height: 1.7; color: var(--body); }
.doctype {
  display: inline-block;
  margin-top: 34px;
  padding: 10px 18px;
  border: 1px solid var(--divider);
  border-radius: 8px;
  color: var(--red);
  font-size: 20px;
  font-weight: 700;
}
</style>
</head>
<body>
<div class="canvas">
  <div class="kicker">INFOGRAPHIC · 信息图</div>
  <h1 class="title">标题写在这里<br><span class="red">红色副题</span></h1>
  <p class="subtitle">一段说明，概括这张信息图要回答的问题。</p>
  <div class="meta-line"><span>来源 01</span><span>来源 02</span><span>日期</span></div>
  <div class="flow">
    <div class="node"><span class="no">STEP 01</span><h4>第一步</h4><p>一句话说明这一步。</p></div>
    <div class="node"><span class="no">STEP 02</span><h4>第二步</h4><p>一句话说明这一步。</p></div>
    <div class="node"><span class="no">STEP 03</span><h4>第三步</h4><p>一句话说明这一步。</p></div>
    <div class="node"><span class="no">STEP 04</span><h4>结论</h4><p>一句话收束核心结论。</p></div>
  </div>
  <span class="doctype">信息图 · 暖纸红印</span>
</div>
</body>
</html>
